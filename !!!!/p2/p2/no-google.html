    <title>No Google for You</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: black;
        text-align: center;
        font-family: Arial, sans-serif;
        color: red;
        font-size: 50px;
        font-weight: bold;
        animation: shake 0.01s infinite;
      }

      @keyframes shake {
        0% {
          transform: translate(2px, 2px);
        }
        25% {
          transform: translate(-2px, -2px);
        }
        50% {
          transform: translate(2px, -2px);
        }
        75% {
          transform: translate(-2px, 2px);
        }
        100% {
          transform: translate(0, 0);
        }
      }
    </style>
